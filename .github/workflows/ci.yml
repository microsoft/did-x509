name: CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install cryptography jwcrypto pytest

    - name: Run tests
      run: pytest test.py -v
      working-directory: reference-implementations/python

  typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci
      working-directory: reference-implementations/typescript

    - name: Typecheck
      run: npm run typecheck
      working-directory: reference-implementations/typescript

    - name: Run tests
      run: npm test
      working-directory: reference-implementations/typescript

    - name: Build
      run: npm run build
      working-directory: reference-implementations/typescript
